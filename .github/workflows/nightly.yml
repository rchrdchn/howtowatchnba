name: Nightly schedule refresh
on:
  schedule: [{ cron: "15 9 * * *" }]   # 2:15 AM PT (1:15 AM PST in winter)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: nightly, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run schedule
      - run: npm run build && npm run check
      # Commit refreshed schedule; Cloudflare Pages deploys on push to main (and "tonight" rolls over to the new day).
      - name: Commit data changes
        id: commit
        run: |
          git add -A src/_data
          if git diff --cached --quiet; then echo "No data changes"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly schedule refresh $(date -u +%F)"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # After Cloudflare Pages finishes deploying, ping IndexNow with every sitemap URL.
      - name: IndexNow ping
        if: steps.commit.outputs.pushed == 'true'
        run: |
          KEY=$(node -p "require('./src/_data/site.json').indexNowKey")
          for i in $(seq 1 20); do
            sleep 30
            if curl -fsS "https://howtowatchnba.com/$KEY.txt" | grep -q "$KEY"; then npm run indexnow; exit 0; fi
          done
          echo "Site not reachable yet; skipping IndexNow"
